user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10m; # Aumentato leggermente se invii file GPX/JSON grandi

    # Mappatura dinamica per gestire correttamente sia HTTP normali che WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream flask_backend {
        server web:8000;
    }

    upstream fastapi_backend {
        server fastapi:8000;
    }

    # 1. Reindirizzamento automatico da HTTP (80) ad HTTPS (443)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # 2. Server HTTPS sulla porta 443
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on; # Abilita HTTP/2 per migliori prestazioni
        server_name _;

        # Certificati SSL
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Parametri SSL consigliati & Caching Handshake
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Header di Sicurezza
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Configurazione Proxy Headers Generici
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Endpoints FastAPI (Streaming Telemetria & WebSocket)
        location /stream {
            proxy_pass http://fastapi_backend;
            
            # Supporto Dinamico WebSocket / SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Evita il buffering sui flussi di dati in real-time
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /session {
            proxy_pass http://fastapi_backend;
        }

        # Applicazione principale Flask / Web
        location / {
            proxy_pass http://flask_backend;
            
            access_log /var/log/nginx/access.log;
            error_log /var/log/nginx/error.log;
        }
    }
}