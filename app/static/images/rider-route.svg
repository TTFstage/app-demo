<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">Connected city routes</title>
  <desc id="desc">An abstract geometric city map with a highlighted route and connected waypoints.</desc>
