    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="760" height="640" rx="16" fill="#f0e3d6"/>
